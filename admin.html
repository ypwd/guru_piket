<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin TV Display</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef4fb;color:#10254a}.top{height:78px;background:#2454d8;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top h1{font-size:24px;margin:0}.top span{font-size:16px}.wrap{display:flex;min-height:calc(100vh - 78px)}aside{width:245px;background:#0e172c;color:white;padding:22px 14px}aside button{width:100%;text-align:left;border:0;background:transparent;color:#fff;padding:14px;border-radius:10px;font-size:16px;cursor:pointer}aside button.active,aside button:hover{background:#1c55d0}main{flex:1;padding:30px;max-width:1200px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 5px 20px rgba(20,60,100,.1);margin-bottom:20px}.card h2{margin:0 0 20px;color:#0e3f9d}label{display:block;font-weight:700;margin:13px 0 7px}input,textarea,select{width:100%;border:1px solid #ccd9e8;border-radius:9px;padding:12px;font-size:15px}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:9px;padding:11px 17px;cursor:pointer;font-weight:700}.primary{background:#1e59d5;color:#fff}.muted{background:#e8eef7;color:#20395e}.danger{background:#e94b52;color:#fff}.list{width:100%;border-collapse:collapse}.list th,.list td{padding:12px;border-bottom:1px solid #e1e9f3;text-align:left;vertical-align:top}.list th{background:#f4f8fd}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.on{background:#d9f8e7;color:#08733c}.off{background:#edf0f4;color:#667}.msg{padding:12px;border-radius:9px;margin-bottom:15px;display:none}.ok{background:#dff7e9;color:#08733c}.err{background:#ffe3e5;color:#a52029}.small{font-size:13px;color:#65748b}
@media(max-width:800px){aside{width:190px}.row{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<header class="top"><h1>TV Display — Admin</h1><span>Kelola Informasi Sekolah</span></header>
<div class="wrap"><aside><button class="active">📢 Informasi Sekolah</button><button onclick="location.href='tv.html'">📺 Lihat TV Display</button></aside>
<main><div id="msg" class="msg"></div>
<section class="card"><h2 id="formTitle">Tambah Informasi Sekolah</h2><input id="id" type="hidden"><label>Judul Informasi</label><input id="title" maxlength="120" placeholder="Contoh: Upacara Bendera"><label>Isi Informasi</label><textarea id="content" maxlength="2000" placeholder="Tulis informasi yang akan tampil di TV..."></textarea><div class="row"><div><label>Status</label><select id="status"><option>Aktif</option><option>Nonaktif</option></select></div><div><label>Urutan Tampil</label><input id="order" type="number" min="1" value="1"></div></div><div class="actions"><button class="btn primary" onclick="save()">💾 Simpan Informasi</button><button class="btn muted" onclick="resetForm()">Batal</button></div><p class="small">Informasi berstatus Aktif akan ditampilkan pada TV. Jika ada beberapa informasi aktif, TV akan menampilkannya bergantian.</p></section>
<section class="card"><h2>Daftar Informasi</h2><div id="tableWrap">Memuat...</div></section>
</main></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwx38PwBI22s-zRmqxiWKI10DEUEelF8px3MGYOBBtXcBuwQAzsAbVq86CfhmheZsdn/exec';
let KEY=sessionStorage.getItem('TV_ADMIN_KEY')||'';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function msg(t,ok=true){const e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'ok':'err');e.style.display='block';setTimeout(()=>e.style.display='none',3500);}
function ensureKey(){if(KEY)return true;KEY=prompt('Masukkan Kunci Admin TV Display:')||'';if(KEY)sessionStorage.setItem('TV_ADMIN_KEY',KEY);return !!KEY;}
function call(action,params={}){if(!ensureKey())return Promise.reject(Error('Kunci admin belum diisi.'));const q=new URLSearchParams(Object.assign({action,key:KEY,_:Date.now()},params));return fetch(API_URL+'?'+q.toString()).then(r=>r.text()).then(t=>{let d;try{d=JSON.parse(t)}catch(e){throw Error('Respons server tidak valid. Pastikan Web App sudah dideploy sebagai akses publik.')}if(!d.ok){if(/kunci admin/i.test(d.error||'')){sessionStorage.removeItem('TV_ADMIN_KEY');KEY='';}throw Error(d.error||'Terjadi kesalahan.')}return d;});}
function load(){if(!API_URL||API_URL.includes('PASTE_')){document.getElementById('tableWrap').innerHTML='<b>Isi API_URL terlebih dahulu.</b>';return}call('listInfo').then(d=>render(d.items)).catch(e=>{document.getElementById('tableWrap').innerHTML='<span style="color:#a52029">'+esc(e.message)+'</span>';});}
function render(items){if(!items.length){document.getElementById('tableWrap').innerHTML='<p>Belum ada informasi.</p>';return}document.getElementById('tableWrap').innerHTML='<table class="list"><thead><tr><th>Judul</th><th>Isi</th><th>Status</th><th>Urutan</th><th>Aksi</th></tr></thead><tbody>'+items.map(x=>'<tr><td><b>'+esc(x.title)+'</b></td><td>'+esc(x.content).replace(/\n/g,'<br>')+'</td><td><span class="badge '+(x.status==='Aktif'?'on':'off')+'">'+esc(x.status)+'</span></td><td>'+x.order+'</td><td><button class="btn muted" onclick=\'edit('+JSON.stringify(x)+')\'>Edit</button> <button class="btn muted" onclick=\'toggle("'+esc(x.id)+'","'+(x.status==='Aktif'?'Nonaktif':'Aktif')+'")\'>'+ (x.status==='Aktif'?'Nonaktifkan':'Aktifkan') +'</button> <button class="btn danger" onclick=\'del("'+esc(x.id)+'")\'>Hapus</button></td></tr>').join('')+'</tbody></table>';}
function save(){const p={id:document.getElementById('id').value,title:document.getElementById('title').value,content:document.getElementById('content').value,status:document.getElementById('status').value,order:document.getElementById('order').value};call('saveInfo',p).then(d=>{msg(d.message);resetForm();load();}).catch(e=>msg(e.message,false));}
function edit(x){document.getElementById('formTitle').textContent='Edit Informasi Sekolah';document.getElementById('id').value=x.id;document.getElementById('title').value=x.title;document.getElementById('content').value=x.content;document.getElementById('status').value=x.status;document.getElementById('order').value=x.order;window.scrollTo({top:0,behavior:'smooth'});}
function resetForm(){['id','title','content'].forEach(i=>document.getElementById(i).value='');document.getElementById('status').value='Aktif';document.getElementById('order').value='1';document.getElementById('formTitle').textContent='Tambah Informasi Sekolah';}
function toggle(id,status){call('toggleInfo',{id,status}).then(d=>{msg(d.message);load();}).catch(e=>msg(e.message,false));}
function del(id){if(!confirm('Hapus informasi ini?'))return;call('deleteInfo',{id}).then(d=>{msg(d.message);load();}).catch(e=>msg(e.message,false));}
load();
</script>
</body></html>
